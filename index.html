<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursive Brute-Force Simulator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="control-panel panel">
        <h2>Target Parameters</h2>
        <div class="input-group">
          <label for="target-input">Target Password (max 5 char):</label>
          <input
            type="text"
            id="target-input"
            maxlength="5"
            placeholder="e.g., dog"
          />
        </div>

        <div class="input-group checkbox-group">
          <label>Character Set:</label>
          <div class="checkboxes">
            <label
              ><input type="checkbox" id="char-lowercase" checked /> a-z</label
            >
            <label><input type="checkbox" id="char-uppercase" /> A-Z</label>
            <label><input type="checkbox" id="char-numbers" /> 0-9</label>
            <label><input type="checkbox" id="char-symbols" /> !@#...</label>
          </div>
        </div>

        <div class="input-group">
          <label for="speed-input">Simulation Speed (ms per attempt):</label>
          <input type="number" id="speed-input" min="1" max="1000" value="50" />
        </div>

        <div class="button-group">
          <button id="start-btn">Start Simulation</button>
          <button id="stop-btn" class="secondary" disabled>Stop</button>
        </div>
      </div>

      <div class="log-panel panel">
        <h3>Live Activity Log</h3>
        <ul id="activity-log">
          <li class="system-message">
            Enter target parameters and click 'Start'
          </li>
        </ul>
      </div>

      <div class="results-sidebar panel">
        <h2>Live Statistics</h2>
        <div class="stat-card">
          <h3>Total Attempts</h3>
          <p id="stat-attempts">0</p>
        </div>
        <div class="stat-card">
          <h3>Current Combination</h3>
          <p id="stat-current">--</p>
        </div>
        <div class="stat-card">
          <h3>Time Elapsed</h3>
          <p id="stat-time">0s</p>
        </div>
        <div class="stat-card">
          <h3>Status</h3>
          <p id="stat-status" class="status-ready">Ready</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
